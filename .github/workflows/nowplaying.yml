name: nowplaying

on:
  schedule:
    # best-effort; GitHub cron is often delayed, which is fine for "recent"
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nowplaying
  cancel-in-progress: true

jobs:
  nowplaying:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: update now-playing section
        env:
          STATSFM_USER: cupidthatbtc
        run: node .github/scripts/nowplaying.mjs

      - name: commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update now playing"
            git push
          else
            echo "no change to now-playing section"
          fi
