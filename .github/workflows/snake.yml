name: profile assets

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: cupidthatbtc
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.svg

      - name: generate stats svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_LOGIN: cupidthatbtc
        run: |
          sudo chown -R "$USER" dist   # snk runs in a container and writes dist/ as root
          python3 scripts/gen_stats.py dist/github-stats-dark.svg

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
